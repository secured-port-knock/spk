name: Build
run-name: ${{ github.workflow }} - ${{ github.event.head_commit.message }}

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Set to "false" to skip uploading build artifacts after each run (default).
  # Set to "true" to keep artifacts.
  KEEP_ARTIFACTS: "false"

jobs:
  # ---------------------------------------------------------------
  # Direct cross-compile matrix: a fast per-target compile check,
  # independent of the build scripts exercised in the jobs below.
  # ---------------------------------------------------------------
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Read version
        id: version
        run: |
          VERSION=$(cat version/version_base.txt | tr -d '[:space:]')
          BUILD=$(cat version/build_number.txt | tr -d '[:space:]')
          COMMIT=$(git rev-parse --short HEAD)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "full=$VERSION.$BUILD" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          MODULE="github.com/secured-port-knock/spk/internal/app"
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          OUTPUT="build/spk_${{ steps.version.outputs.full }}-${{ matrix.goos }}-${{ matrix.goarch }}${EXT}"
          go build -buildvcs=false \
            -ldflags "-s -w -X ${MODULE}.version=${{ steps.version.outputs.version }} -X ${MODULE}.commit=${{ steps.version.outputs.commit }} -X ${MODULE}.buildNumber=${{ steps.version.outputs.build }}" \
            -trimpath \
            -o "$OUTPUT" \
            ./

      - name: Upload artifact
        if: env.KEEP_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: spk-${{ matrix.goos }}-${{ matrix.goarch }}
          path: build/spk_*

  # ---------------------------------------------------------------
  # Build script verification -- Linux (ubuntu-latest)
  # Tests: all-platforms amd64+arm64, linux/windows pcap via zig,
  #        darwin pcap skipped (no native macOS toolchain),
  #        nopcap, deb+rpm packaging, build script -test flag.
  # ---------------------------------------------------------------
  build-scripts-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Zig
        uses: mlugg/setup-zig@v1
        with:
          version: "0.13.0"

      - name: Install tools (libpcap, nfpm)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libpcap-dev
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      # Each call starts by clearing build/, so only the last one's output
      # survives. The no-pcap mode is exercised first; the pcap pass over every
      # target then produces what gets uploaded, packages included. The
      # -linux -deb -rpm call that used to come last threw away every
      # cross-compiled binary the earlier calls had produced.
      - name: Build all platforms without pcap
        run: chmod +x build.sh && ./build.sh -all -nopcap

      - name: Build all platforms amd64+arm64 (pcap via zig) and package linux
        run: ./build.sh -all -deb -rpm

      - name: Run tests via build script (-test flag)
        run: ./build.sh -test

      - name: Build script tests
        run: go test -tags scripts -count=1 -timeout 900s ./tests/scripts/

      - name: Upload build artifacts
        if: env.KEEP_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-linux
          path: build/

  # ---------------------------------------------------------------
  # Build script verification -- Windows (windows-latest)
  # Tests: all-platforms amd64+arm64, windows pcap (pure Go),
  #        linux pcap via zig, darwin pcap skipped (no native
  #        macOS toolchain), nopcap, deb+rpm packaging (cross-
  #        compiled linux binary), build script -test flag.
  # ---------------------------------------------------------------
  build-scripts-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Zig
        uses: mlugg/setup-zig@v1
        with:
          version: "0.13.0"

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      # Each call starts by clearing build/, so only the last one's output
      # survives -- see the linux job above.
      - name: Build all platforms without pcap
        run: .\build.ps1 -all -nopcap

      - name: Build all platforms amd64+arm64 and package linux
        run: .\build.ps1 -all -deb -rpm

      - name: Run tests via build script (-test flag)
        run: .\build.ps1 -test

      - name: Build script tests
        run: go test -tags scripts -count=1 -timeout 900s ./tests/scripts/

      - name: Upload build artifacts
        if: env.KEEP_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-windows
          path: build/

  # ---------------------------------------------------------------
  # Build script verification -- macOS (macos-latest, arm64)
  # Tests: all-platforms amd64+arm64, linux/windows pcap via zig,
  #        darwin/arm64 pcap via native clang (IS_NATIVE),
  #        darwin/amd64 no-pcap (cross-arch; zig never used for darwin),
  #        nopcap, deb+rpm packaging, build script -test flag.
  # ---------------------------------------------------------------
  build-scripts-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Zig
        uses: mlugg/setup-zig@v1
        with:
          version: "0.13.0"

      - name: Install tools (nfpm)
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      # Each call starts by clearing build/, so only the last one's output
      # survives -- see the linux job above.
      - name: Build all platforms without pcap
        run: chmod +x build.sh && ./build.sh -all -nopcap

      - name: Build all platforms amd64+arm64 (linux/windows pcap via zig; darwin via native clang) and package linux
        run: ./build.sh -all -deb -rpm

      - name: Run tests via build script (-test flag)
        run: ./build.sh -test

      - name: Build script tests
        run: go test -tags scripts -count=1 -timeout 900s ./tests/scripts/

      - name: Upload build artifacts
        if: env.KEEP_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-macos
          path: build/

  # ---------------------------------------------------------------
  # Build script verification -- no zig, Linux (ubuntu-latest)
  # Verifies behavior when zig is absent:
  #   windows/*      -> pcap (pure Go, always)
  #   linux/amd64    -> pcap (native gcc, host is amd64)
  #   linux/arm64    -> no-pcap (cross, no zig)
  #   darwin/*       -> no-pcap (cross from linux, no native clang)
  # ---------------------------------------------------------------
  build-scripts-linux-nozig:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install libpcap (for native linux/amd64 pcap without zig)
        run: sudo apt-get update -qq && sudo apt-get install -y libpcap-dev

      - name: Build all platforms (no zig installed)
        run: chmod +x build.sh && ./build.sh -all

      - name: Verify expected pcap/no-pcap outputs
        run: |
          fail=0
          expect_pcap()   { find "build/$1" -name "*p-$1-$2*" -type f 2>/dev/null | grep -q . || { echo "FAIL: expected pcap binary for $1/$2"; fail=1; }; }
          expect_nopcap() { find "build/$1" -name "*p-$1-$2*" -type f 2>/dev/null | grep -q . && { echo "FAIL: unexpected pcap binary for $1/$2 (should be no-pcap)"; fail=1; } || true; }
          expect_pcap   windows amd64
          expect_pcap   windows arm64
          expect_pcap   linux   amd64
          expect_nopcap linux   arm64
          expect_nopcap darwin  amd64
          expect_nopcap darwin  arm64
          exit $fail

      - name: Upload build artifacts
        if: env.KEEP_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-linux-nozig
          path: build/

  # ---------------------------------------------------------------
  # Build script verification -- no zig, macOS (macos-latest, arm64)
  # Verifies behavior when zig is absent:
  #   windows/*      -> pcap (pure Go, always)
  #   linux/*        -> no-pcap (cross from macOS, no zig)
  #   darwin/arm64   -> pcap (native clang, host is arm64)
  #   darwin/amd64   -> no-pcap (cross-arch on arm64 host)
  # ---------------------------------------------------------------
  build-scripts-macos-nozig:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build all platforms (no zig installed)
        run: chmod +x build.sh && ./build.sh -all

      - name: Verify expected pcap/no-pcap outputs
        run: |
          fail=0
          expect_pcap()   { find "build/$1" -name "*p-$1-$2*" -type f 2>/dev/null | grep -q . || { echo "FAIL: expected pcap binary for $1/$2"; fail=1; }; }
          expect_nopcap() { find "build/$1" -name "*p-$1-$2*" -type f 2>/dev/null | grep -q . && { echo "FAIL: unexpected pcap binary for $1/$2 (should be no-pcap)"; fail=1; } || true; }
          expect_pcap   windows amd64
          expect_pcap   windows arm64
          expect_nopcap linux   amd64
          expect_nopcap linux   arm64
          expect_nopcap darwin  amd64
          expect_pcap   darwin  arm64
          exit $fail

      - name: Upload build artifacts
        if: env.KEEP_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-macos-nozig
          path: build/

  # ---------------------------------------------------------------
  # Build script verification -- no zig, Windows (windows-latest)
  # Verifies behavior when zig is absent:
  #   windows/*      -> pcap (pure Go, always)
  #   linux/*        -> no-pcap (cross from Windows, no zig/gcc)
  #   darwin/*       -> no-pcap (cross from Windows, no native clang)
  # ---------------------------------------------------------------
  build-scripts-windows-nozig:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build all platforms (no zig installed)
        run: .\build.ps1 -all

      - name: Verify expected pcap/no-pcap outputs
        run: |
          $fail = $false
          function Expect-Pcap($os, $arch) {
            $found = Get-ChildItem "build\$os" -Filter "*p-${os}-${arch}*" -ErrorAction SilentlyContinue
            if (-not $found) { Write-Host "FAIL: expected pcap binary for $os/$arch" -ForegroundColor Red; $script:fail = $true }
          }
          function Expect-NoPcap($os, $arch) {
            $found = Get-ChildItem "build\$os" -Filter "*p-${os}-${arch}*" -ErrorAction SilentlyContinue
            if ($found) { Write-Host "FAIL: unexpected pcap binary for $os/$arch (should be no-pcap)" -ForegroundColor Red; $script:fail = $true }
          }
          Expect-Pcap   windows amd64
          Expect-Pcap   windows arm64
          Expect-NoPcap linux   amd64
          Expect-NoPcap linux   arm64
          Expect-NoPcap darwin  amd64
          Expect-NoPcap darwin  arm64
          if ($fail) { exit 1 }

      - name: Upload build artifacts
        if: env.KEEP_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-windows-nozig
          path: build/

  # ---------------------------------------------------------------
  # Build script verification -- macOS Intel (macos-##-intel, amd64)
  # Tests: all-platforms amd64+arm64, linux/windows pcap via zig,
  #        darwin/amd64 pcap via native clang (IS_NATIVE, Intel host),
  #        darwin/arm64 no-pcap (cross-arch on Intel host),
  #        nopcap, deb+rpm packaging, build script -test flag.
  # ---------------------------------------------------------------
  build-scripts-macos-intel:
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Zig
        uses: mlugg/setup-zig@v1
        with:
          version: "0.13.0"

      - name: Install tools (nfpm)
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      # Each call starts by clearing build/, so only the last one's output
      # survives -- see the linux job above.
      - name: Build all platforms without pcap
        run: chmod +x build.sh && ./build.sh -all -nopcap

      - name: Build all platforms amd64+arm64 (linux/windows pcap via zig; darwin/amd64 pcap via native clang) and package linux
        run: ./build.sh -all -deb -rpm

      - name: Run tests via build script (-test flag)
        run: ./build.sh -test

      - name: Build script tests
        run: go test -tags scripts -count=1 -timeout 900s ./tests/scripts/

      - name: Upload build artifacts
        if: env.KEEP_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-macos-intel
          path: build/

  # ---------------------------------------------------------------
  # Build script verification -- no zig, macOS Intel (macos-##-intel, amd64)
  # Verifies behavior when zig is absent:
  #   windows/*      -> pcap (pure Go, always)
  #   linux/*        -> no-pcap (cross from macOS, no zig)
  #   darwin/amd64   -> pcap (native clang, host IS amd64)
  #   darwin/arm64   -> no-pcap (cross-arch on Intel host)
  # ---------------------------------------------------------------
  build-scripts-macos-intel-nozig:
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build all platforms (no zig installed)
        run: chmod +x build.sh && ./build.sh -all

      - name: Verify expected pcap/no-pcap outputs
        run: |
          fail=0
          expect_pcap()   { find "build/$1" -name "*p-$1-$2*" -type f 2>/dev/null | grep -q . || { echo "FAIL: expected pcap binary for $1/$2"; fail=1; }; }
          expect_nopcap() { find "build/$1" -name "*p-$1-$2*" -type f 2>/dev/null | grep -q . && { echo "FAIL: unexpected pcap binary for $1/$2 (should be no-pcap)"; fail=1; } || true; }
          expect_pcap   windows amd64
          expect_pcap   windows arm64
          expect_nopcap linux   amd64
          expect_nopcap linux   arm64
          expect_pcap   darwin  amd64
          expect_nopcap darwin  arm64
          exit $fail

      - name: Upload build artifacts
        if: env.KEEP_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-macos-intel-nozig
          path: build/
